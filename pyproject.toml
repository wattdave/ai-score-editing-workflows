[project]
name = "sibelius-websocket-cli"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "David Watt", email = "sibelius-ai-workflows@dave.wattlink.net" }
]
requires-python = ">=3.13"
dependencies = [
    "websockets>=17.1",
]

[project.scripts]
sibelius-websocket-cli = "sibelius_websocket_cli:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
