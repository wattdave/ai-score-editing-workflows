[project]
name = "ai-score-editing-workflows"
version = "0.1.0"
description = "AI-driven score editing for Sibelius, Dorico and MuseScore: CLIs, MCP servers and bridge plug-ins"
readme = "README.md"
authors = [
    { name = "David Watt", email = "sibelius-ai-workflows@dave.wattlink.net" }
]
requires-python = ">=3.13"
dependencies = [
    "mcp>=2.2",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "websockets>=17.1",
]

[project.scripts]
sibelius-cli = "ai_score_editing:main"
# Deprecated alias for sibelius-cli, kept for one release.
sibelius-websocket-cli = "ai_score_editing:deprecated_main"
sibelius-mcp = "ai_score_editing.sibelius.mcp_server:main"
dorico-cli = "ai_score_editing.dorico.cli:main"
dorico-mcp = "ai_score_editing.dorico.mcp_server:main"
musescore-cli = "ai_score_editing.musescore.cli:main"
musescore-mcp = "ai_score_editing.musescore.mcp_server:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ai_score_editing"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

# This project resolves from public PyPI only, even where a user-level uv
# config sets another default index (a project's default index wins over a
# user's), so `uv sync` and `uv run` work anywhere and uv.lock stays public.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
