[project]
name = "sibelius-websocket-cli"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "David Watt", email = "sibelius-ai-workflows@dave.wattlink.net" }
]
requires-python = ">=3.13"
dependencies = [
    "mcp>=2.2",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "websockets>=17.1",
]

[project.scripts]
sibelius-websocket-cli = "sibelius_websocket_cli:main"
sibelius-mcp = "sibelius_websocket_cli.mcp_server:main"
dorico-cli = "sibelius_websocket_cli.dorico.cli:main"
dorico-mcp = "sibelius_websocket_cli.dorico.mcp_server:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
