name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install xmllint (MusicXML schema validation tests)
        run: command -v xmllint || (sudo apt-get update && sudo apt-get install -y libxml2-utils)
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: python3 scripts/sync_skills.py --check
